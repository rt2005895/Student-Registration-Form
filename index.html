<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
    <title> Student Registration Form </title>
<head>
    <body>
        <form> <fieldset>
            <legend>
                <h1>
                    Student Registration Form
                </h1>
            </legend>
        
            <div>
                NAME : <input type="text">
            </div>
            <br>
            <div>
                Father's Name : <input type="text">
            </div>
            <br>
            <div>
                Phone No : <input type="text">
            </div>
            <br>
            <div>
                Email : <input type="email">
            </div>
            <br>

            <div>
                <label>GENDER</label>
                <div class="inline-group">
                <label><input type="radio" name="gender"> Male</label>
                <label><input type="radio" name="gender"> Female</label>
                <label><input type="radio" name="gender"> Other</label>
            </div>

            </div>
            <br>

            <div>
                Date Of Birth: <input type="date">
            </div>
            <br>

            <div>
                Address: <input type="text">
            </div>
            <br>

            <div>
               Blood Group 
               <select name="drop-down">
                    <option value = "A">A</option>
                    <option value = "A+">A+</option>
                    <option value = "B">B</option>
                    <option value = "B+">B+</option>
                    <option value = "O-">O-</option>

               </select>
            </div>
            <br>
            <div>
                <label>DEPARTMENT</label>
                <div class="inline-group">
                <label><input type="radio" name="department"> Computer Science</label>
                <label><input type="radio" name="department"> Mathematics</label>
                <label><input type="radio" name="department"> Other</label>
                
            </div>
            <br>
       
            <div>
                <label>Course</label>
                <div class="inline-group">
                <label><input type="radio" name="course"> Java Script</label>
                <label><input type="radio" name="course"> C Language</label>
                <label><input type="radio" name="course"> Spoken English</label>
            </div>
            <br>

            <div>
                Add Chalan:<input type="file">
            </div>
            <br>

            <div>
                <input type="submit"value="Submit">
                <input type="reset"value="Reset">
            </div>
        
        </fieldset>
        </form>
    </body>
</html>
